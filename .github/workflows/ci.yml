name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Os testes de lembretes usam horários de parede em -03:00; os runners rodam em UTC.
  TZ: America/Sao_Paulo

jobs:
  linux:
    name: Testes, tipos, build web e e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Os testes não abrem o Electron: o binário só seria baixado à toa.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
      - run: npm ci
      # Verificadores estáticos: só leem arquivos, rodam em menos de um segundo e não dependem do
      # macOS. Fora da CI eles apodreceram sem ninguém ver (um lia um caminho que já não existia e o
      # outro reprovava declarações de tipo); aqui uma quebra aparece no PR.
      - run: npm run parity:check
      - run: npm run safety:renderer
      # Vitest e node --test. Sem o binário do addon (que só compila no macOS), `host.test.cjs`
      # se pula explicitamente, com motivo no relatório; quem o exercita é o job macos-native.
      - run: npm test
      # O mesmo suite bem a leste do UTC. Um dia de calendário montado a partir de um instante fixo
      # em -03:00 passa no fuso de cima e quebra aqui, que foi como lembretes semanais chegaram a
      # ser gravados no dia errado; rodar nos dois fusos impede a regressão silenciosa.
      - run: npm test
        env:
          TZ: Pacific/Kiritimati
      - run: npx tsc --noEmit
      # `npm run build` compila o addon, que só existe no macOS; aqui só o build web.
      - run: npx vite build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: /tmp/hibi-playwright-results
          retention-days: 7
          if-no-files-found: ignore

  macos-native:
    name: Addon nativo (macOS)
    # Runner macOS consome 10x a cota de minutos em repositório privado: roda no main e sob demanda.
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
      - run: npm ci
      - run: npm --prefix native/notch ci
      - run: npm run native:build
      # Único lugar onde o binário compilado é exercitado de verdade: com o addon presente,
      # `native/notch/host.test.cjs` cria o NSPanel, mede o frame na tela real e o destrói,
      # em vez de se pular. É o que torna este job mais que uma recompilação.
      - run: node --test 'native/notch/*.test.cjs' 'native/notch/*.test.mjs' 'electron/**/*.test.cjs' 'electron/**/*.test.mjs'

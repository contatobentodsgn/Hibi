<!--
  macOS menu-bar template icon. Per Apple HIG + NSStatusItem docs, status
  bar images must be template images: AppKit reads only the alpha channel
  and picks the right tint (black on light bars, white on dark bars,
  highlighted on click). The RGB values below are black by convention so
  the file previews sensibly in Finder, but only alpha is what AppKit
  renders.

  Geometry from taby-favicon-square.svg (the canonical brand mark).
  viewBox is cropped to the face frame's bounding box plus a half-stroke
  of breathing room — this lets the face fill the full menu-bar height
  rather than leaving empty padding above/below.
-->
